examples:
  # aggr1 in requests ... aggregationTerms-examples
  - requestId: aggr1
    aggregationTerms:
      - id: SexAtBirth 
    categoriesAndValues:
      - ids: ["NCIT:C16576"]
        names: ["female"]
        count: 778
      - id: ["NCIT:C20197"]
        names: [male]
        count: 957
      - ids: ["NCIT:C1799"]
        names: ["unknown"]
        count: 11

  # /individuals - counting how many individuals have each of the selected diagnoses in the matched data. If one individual has multiple diagnoses, they will be counted in each of the respective categories.
  - requestId: aggr2
    aggregationTerms:
      - id: SelectedCarcinomaDiagnoses
        label: Selected diagnoses (some carcinoma entities)
    categoriesAndValues:
      - ids: ["NCIT:C2919"]
        names: ["Prostate Adenocarcinoma"]
        count: 426
      - ids: ["NCIT:C4017"] 
        names: ["Breast Ductal Carcinoma"]
        count: 523
      - ids: ["NCIT:C3512"]
        names: ["Lung Adenocarcinoma"]
        count: 317

  - requestId: aggr3
    aggregationTerms:
      - id: SexAtBirth
        label: Sex at Birth
      - id: HistologicalDiagnoses
        label: Selected Diagnoses
    categoriesAndValues:
      - ids: ["NCIT:C20197", "NCIT:C2919"]
        names: ["male", "Prostate Adenocarcinoma"]
        count: 426
      - ids: ["NCIT:C16576", "NCIT:C2919"]
        names: ["female", "Prostate Adenocarcinoma"]
        count: 0
      - ids: ["NCIT:C20197", "NCIT:C4017"] 
        names: ["male", "Breast Ductal Carcinoma"]
        count: 4
      - ids: ["NCIT:C16576", "NCIT:C4017"] 
        names: ["female", "Breast Ductal Carcinoma"]
        count: 501
      - ids: ["NCIT:C20197", "NCIT:C3512"] 
        names: ["male", "Lung Adenocarcinoma"]
        count: 201
      - ids: ["NCIT:C16576", "NCIT:C3512"] 
        names: ["female", "Lung Adenocarcinoma"]
        count: 66

  - requestId: aggr4
    aggregationTerms:
      - id: AgeOfOnset
        description: >-
          Age of onset of the disease addressed in the data. The aggregation of
          age values has been peformed on splits for the indicated age ranges.
          The number of individuals with unknown or older age of onset is included
          as a separate category.
        sorted: True
    categoriesAndValues:
      - ids: ["[P0D, P18M)"]
        names: ["birth to 18 months"]
        count: 426
      - ids: ["[P18M, P10Y)"]
        names: ["1.5 to 10 years"]
        count: 339
      - ids: ["[P10Y, P60Y)"]
        names: ["10 to 60 years"]
        count: 61
      - ids: ["other"]
        names: ["older or unknown"]
        count: 719

  - requestId: aggr5
    aggregationTerms:
      - id: CancerPanelGeneIds
        label: Cancer Panel Genes
      - id: VariantVRSCNVtype
    categoriesAndValues:
      - ids: ["CDKN2A", "EFO:0020073"]
        names: ["CDKN2A", "high-level loss"]
        count: 277
      - ids: ["CDKN2A", "EFO:0030072"]
        names: ["CDKN2A", "high-level gain"]
        count: 0
      - ids: ["TP53", "EFO:0020073"]
        names: ["TP53", "high-level loss"]
        count: 68
      - ids: ["TP53", "EFO:0030072"]
        names: ["TP53", "high-level gain"]
        count: 4
      - ids: ["EGFR", "EFO:0020073"]
        names: ["EGFR", "high-level loss"]
        count: 0
      - ids: ["EGFR", "EFO:0030072"]
        names: ["EGFR", "high-level gain"]
        count: 161
      - ids: ["MYCN", "EFO:0020073"]
        names: ["MYCN", "high-level loss"]
        count: 2
      - ids: ["MYCN", "EFO:0030072"]
        names: ["MYCN", "high-level gain"]
        count: 88

  - requestId: aggr6
    aggregationTerms:
      - id: followupIndividuals
        description: >-
          Number of individuals with follow-up data.
    anyValueCount: 3456

  - requestId: aggr7
    aggregationTerms:
      - id: biosampleIds
        description: >-
          Number of distinct biosample ids, used to indicate the number of
          biosamples.
    distinctValuesCount: 243062

