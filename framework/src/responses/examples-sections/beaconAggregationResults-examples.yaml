  - requestId: aggr4
    aggregationTerms:
      - id: AgeOfOnset
        description: >-
          Age of onset of the disease addressed in the data. The aggregation of
          age values has been peformed on splits for the indicated age ranges.
          The number of individuals with unknown or older age of onset is included
          as a separate category.
        sorted: True
    categoriesAndValues:
      - categories:
          - value: "[P0D, P18M)"
            name: birth to 18 months
        count: 426
      - categories:
          - value: "[P18M, P10Y)"
            name: "1.5 to 10 years"
        count: 339
      - categories:
          - value: "[P10Y, P60Y)"
            name: 10 to 60 years
        count: 61
      - categories:
          - value: other
            name: older or unknown
        count: 719

