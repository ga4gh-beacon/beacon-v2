examples:
  # aggr1 in requests ... aggregationTerms-examples
  - requestId: aggr1
    aggregationTerms:
      - id: SexAtBirth 
    categoriesAndValues:
      - categories:
          - value: NCIT:C16576
            name: female
        count: 778
      - categories:
          - value: NCIT:C20197
            name: male
        count: 957
      - categories:
          - value: NCIT:C1799
            name: unknown
        count: 11

  # /individuals - counting how many individuals have each of the selected diagnoses in the matched data. If one individual has multiple diagnoses, they will be counted in each of the respective categories.
  - requestId: aggr2
    aggregationTerms:
      - id: SelectedCarcinomaDiagnoses
        label: Selected diagnoses (some carcinoma entities)
    categoriesAndValues:
      - categories:
          - value: NCIT:C2919
            name: Prostate Adenocarcinoma
        count: 426
      - categories:
          - value: NCIT:C4017
            names: Breast Ductal Carcinoma
        count: 523
      - categories:
          - value: NCIT:C3512
            name: Lung Adenocarcinoma
        count: 317

