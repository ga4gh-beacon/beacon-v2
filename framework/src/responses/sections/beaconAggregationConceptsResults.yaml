$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Aggregation concepts supported for this Beacon.
type: object
properties:
  aggregationConcepts:
    type: array
    items:
      $ref: '#/$defs/AggregationConceptInResponse'

additionalProperties: true

$defs:
  AggregationConceptInResponse:
    type: object
    description: >-
      Information about the aggregation possible using this term.
    required:
      - id
    properties:
      id:
        description: >-
          The aggregation term id.
        type: string
        examples:
          - followupTime
      label:
        description: >-
          A short label which e.g. can be used by clients to label diagrams or
          data tables.
        type: string
        examples:
          - Follow-up Time After Diagnosis
      description:
        description: >-
          A description of the summary concept, e.g. with details about the
          included properties and the operations performed during aggregation.
      sorted:
        description: >-
          Indicates whether the resulting distribution results will be sorted in
          some way.
        type: boolean
      concept:
        $ref: "./beaconAggregationResults.yaml#/$defs/AggregationConcept"

    examples:
      - id: followupTime
        label: Follow-up Time
        description: Follow-up Time After Diagnosis
        property: individual.diseases.followup
        type: string
        format: iso8601duration
        splits:
          - P0D
          - P18M
          - P10Y
          - P60Y
      - id: disease
        label: Diseases
        description: Disease type in matched individuals
        property: individual.diseases.diseaseCode.id

