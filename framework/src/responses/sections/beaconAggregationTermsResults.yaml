$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Aggregation terms supported for this beacon. The aggregation terms detail
  the respective property and optional selectors (splits, filters) applied when
  generating summaries.
  The structure as object aligns with the filtering terms results and allows for
  later expansion (e.g. adding `resources` for information about terms).
type: object
properties:
  aggregationTerms:
    type: array
    items:
      $ref: "#/$defs/AggregationTermInResponse" 
$defs:
  AggregationTermInResponse:
    properties:
      id:
        type: string
        description: >-
          The id of the aggregation which can be used as a selector. The id should
          be identical to the `modelProperty` if no splits or filters are applied,
          but can be different to indicate a modified scope.
        examples:
          - SexAtBirth
          - FollowupTime
          - HistologicalDiagnoses
      modelProperty:
        description: >-
          The property in the data model on which the aggregation is performed.
          This can be used as a selector for the aggregation in the request.
        type: string
        examples:
          - individual.sex
          - biosample.histologicalDiagnosis
      label:  
        description: >-
          The label for the aggregation concept being reported on.
        type: string
        examples:
          - Sex at Birth
          - Follow-up Time After Diagnosis
          - Diagnoses
      description:
        description: >-
          Description of the aggregation performed for this term.
        type: string
      categories:
        description: >-
          List of selected values for aggregation or splits.
        type: array
        minItems: 1
        items:
          oneOf:
              - $ref: "#/$defs/ValuesForAggregationTerm"
              - $ref: "#/$defs/SplitItem"
        examples:
          - - id: NCIT:C9384
              name: Kidney Carcinoma
            - id: NCIT:C3513
              name: Esophageal Carcinoma
            - id: NCIT:C35850
              name: Head and Neck Carcinoma
          - - id: sex.male
              name: men
            - id: sex.female
              name: women
            - id: sex.others
              name: others
          - - id: lymphoma
              name: Lymphomes
            - id: melanoma
              name: Melanomas
            - id: others
              name: Other cancer types
    required:
      - id
      - modelProperty    
  ValuesForAggregationTerm:
        description: >-
          List of selected values for aggregation.
        type: array
        minItems: 1
        items:
          $ref: ../../common/basicElement.yaml
        examples:
          - - id: NCIT:C9384
              name: Kidney Carcinoma
            - id: NCIT:C3513
              name: Esophageal Carcinoma
            - id: NCIT:C35850
              name: Head and Neck Carcinoma
          - - id: sex.male
              name: men
            - id: sex.female
              name: women
            - id: sex.others
              name: others
  SplitItem:
    description: >-
      A split item for binning values during aggregation.
    type: object
    properties:
      upperBound:
        description: >-
          The value for the split, representing inclusive lower bounds to exclusive upper bounds.
          TODO: Other types than string? String can be a value/unit string...
          Overmodeling this might get too complex.
        type: string
      label:
        description: >-
          A human readable label for the bin resulting from the split.
        type: string
      sortOrder:
        description: >-
          Optional integer to specify the order of splits.
        type: integer
    required:
      - upperBound
      - sortOrder 
    examples:
      - - upperBound: P18M
          label: < 18 months
          sortOrder: 1
        - upperBound: P18Y
          label: 18 months to less than 18 years
          sortOrder: 2
        - upperBound: P65Y
          label: 18 years to less than 65 years
          sortOrder: 3
        - upperBound: P150Y
          label: 65 years and older
          sortOrder: 4
      - - upperBound: 10
          label: 0kg to less than 10kg
          sortOrder: 1
        - upperBound: 25
          label: 10kg to less than 25kg
          sortOrder: 2
        - upperBound: 999
          label: 25kg and more
          sortOrder: 3

