$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Aggregation terms supported for this beacon. The aggregation terms deatil
  the respective property and optional selectors (splits, filters) applied when
  generating summaries.
  The structure as object aligns with the filtering terms results and allows for
  later expansion (e.g. adding `resources` for information about terms).
type: object
properties:
  aggregationTerms:
    type: array
    items:
      $ref: "#/$defs/AggregationTermInResponse"

$defs:
  AggregationTermInResponse:
    properties:
      id:
        type: string
        description: >-
          The id of the aggregation which can be used e.g. as a selector.
        examples:
          - SexAtBirth
          - FollowupTime
          - HistologicalDiagnoses
      label:
        description: >-
          The label for the aggregation concept being reported on.
        type: string
        examples:
          - Sex at Birth
          - Follow-up Time After Diagnosis
          - Diagnoses
      description:
        description: >-
          Description of the aggregation performed for this term.
        type: string
      filters:
        description: >-
          Optional list of filters to select specific values for aggregation.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/AggregationTermFilter"
      splits:
        description: >-
          Optional list of **sorted** splits to group values for ranges or bins
          when performing the aggregation.
          TODO: 
            * Define types and/or couple them to property type?
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/SplitItem"

  AggregationTermFilter:
    description: >-
      A filter item for filtering values during aggregation. This is similar to
      the filtering terms but lacking some unnecessary properties (e.g. `scopes`
      since defined through  the parent).
      Note: Filters in aggregations are evaluated in an OR context, _i.e._ to
      select a subset of values from the parent property.
      TODO: Re-use filtering terms (except the OR use)?
    type: object
    properties:
      id:
        description: >-
          The value to be matched for the property.
        type: string
      label:
        description: >-
          A label, for information purposes, for the value to be matched.     
        type: string
    examples:
      - - id: NCIT:C9384
          label: Kidney Carcinoma
        - id: NCIT:C3513
          label: Esophageal Carcinoma
        - id: NCIT:C35850
          label: Head and Neck Carcinoma
      - - id: EFO:0030075
          label: cDNA microarray
        - id: EFO:0010938
          label: large-insert clone DNA microarray
    
  SplitItem:
    description: >-
      A split item for binning values during aggregation.
    type: object
    properties:
      value:
        description: >-
          The value for the split, representing the inclusive lower bounds.
          TODO: Other types than string? String can be a value/unit string...
          Overmodeling this might get too complex.
        type: string
      label:
        description: >-
          A human readable label for the bin resulting from the split.
        type: string
    examples:
      - - value: P18M
          label: < 18 months
        - value: P18Y
          label: 18 months to less than 18 years
        - value: P65Y
          label: 18 years to less than 65 years
        - value: P150Y
          label: 65 years and older
      - - value: 10
          label: 0kg to less than 10kg
        - value: 25
          label: 10kg to less than 25kg
        - value: 999
          label: 25kg and more


