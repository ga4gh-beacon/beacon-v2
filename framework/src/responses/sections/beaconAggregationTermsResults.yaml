$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  List of aggregation terms supported for this beacon. The aggregation terms detail
  the respective property which include the aggregation categories (e.g. all diagnoses or ageAtDiagnosis) applied when generating summaries.
type: object
properties:
  aggregationTerms:
    type: array
    items:
      $ref: "#/$defs/AggregationTermInResponse" 
$defs:
  AggregationTermInResponse:
    properties:
      id:
        type: string
        description: >-
          The id of the aggregation to be used in the request.
        examples:
          - SexAtBirth
          - FollowupTime
          - HistologicalDiagnoses
      label:  
        description: >-
          The label for the aggregation concept being reported on.
        type: string
        examples:
          - Sex at Birth
          - Follow-up Time After Diagnosis
          - Diagnoses
      modelProperty:
        description: >-
          The property in the data model on which the aggregation is actually performed. This is informative.
        type: string
        examples:
          - individual.sex
          - biosample.histologicalDiagnosis
      description:
        description: >-
          Human readable description of the aggregation performed for this term.
        type: string
      selectors:
        description: >-
          Optional selectors for limiting or binning the aggregation on the
          `modelProperty`. If this parameter is present, it indicates that only
          the indicated values would be aggregated or that the results would be
          returned in bins (e.g. for continuous values).
        oneOf:
          - $ref: "../../requests/aggregationTerms.yaml#/#/$defs/ValueSelectors"
          - $ref: "../../requests/aggregationTerms.yaml#/#/$defs/RangeSelectors"
          - $ref: "../../requests/aggregationTerms.yaml#/#/$defs/SplitSelectors"
    required:
      - id
      - modelProperty    
