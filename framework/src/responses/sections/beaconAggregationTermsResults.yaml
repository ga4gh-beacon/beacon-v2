$schema: https://json-schema.org/draft/2020-12/schema
description: >-
  Aggregation concepts supported for this Beacon.
type: object
properties:
  aggregationTerms:
    type: array
    items:
      $ref: "./beaconAggregationResults.yaml#/$defs/AggregationConcept"

  examples:
    - id: followupTime
      label: Follow-up Time
      description: Follow-up Time After Diagnosis
      property: individual.diseases.followup
      type: string
      format: iso8601duration
      sorted: true
      splits:
        - value: P6M
          label: < 6 months
        - value: P1Y
          label: < 1 year
        - value: P18M
          label: < 18 months
        - value: P10Y
          label: < 10 years
        - value: P150Y
          label: "> 10 years"
    - id: disease
      label: Diseases
      description: Disease type in matched individuals
      property: individual.diseases.diseaseCode.id

additionalProperties: false
