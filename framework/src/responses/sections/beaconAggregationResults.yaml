$schema: https://json-schema.org/draft/2020-12/schema
name: Beacon Aggregation Results
description: Beacon aggregate results section.
type: array
minItems: 0
items:
  $ref: "#/$defs/AggregationResultsInstance"
examples:
  $ref: ../examples-sections/beaconAggregationResults-examples.yaml#/examples
$defs:
  AggregationResultsInstance:
    description: >-
      Summary data from results, with distributions of values (or value combinations)
      for one or more concepts.

      Each summary is identified by an `id`, `label`, `description`, and a list
      of one or more `concepts`. An an optional `sorted` property can indicate
      to the client that the returned `distribution` of the aggregation objects
      response has some pre-defined order.

      Each of the `concepts` describes the scope (entity; `individual`, `biosample`
      ...), the property aggregated on, and optional `terms` or `splits` for
      selection or binning of the property values.
    type: object
    properties:
      requestId:
        $comment: >-
          to review
        description: >-
          An optional id for the aggregation request, which can be used for
          tracking and logging purposes. This is not used by the beacon for
          processing the request but can be included in the response metadata.
        type: string
      aggregationTerms:
        type: array
        items:
          $ref: "#/$defs/AggregationConcept"
      categoriesAndValues:
        description: >-
          A aggregation results where each describes the count of one (or more,
          intersected) values for the concept(s) aggregated on.
        type: array
        items:
          $ref: "#/$defs/AggregationCategoriesResult"
      distinctValuesCount:
          $ref: "#/$defs/DistinctValuesCount"
      anyValueCount:
          $ref: "#/$defs/AnyValueCount"

    required:
      - concepts
      - anyOf:
          - categoriesAndValues
          - distinctValuesCount
          - anyValueCount

    additionalItems: True

  AggregationConcept:
    description: >-
      Concept on which the aggregation was performed, including the property
      in the data model and optional termIds or splits for selection
      or binning of the property values.
    type: object
    properties:
      id:
        description: >-
          The aggregation term id. It can be used to limit or combine the aggregations
          performed.
        type: string
        examples:
          - followupTime
          - sexAtBirth
      name:
        description: >-
          A short label which e.g. can be used by clients to label diagrams or
          data tables.
        type: string
        examples:
          - Follow-up Time After Diagnosis
      description:
        description: >-
          A description of the summary concept, e.g. with details about the
          included property and the operations performed during aggregation.
      sorted:
        description: >-
          Indicates whether the resulting distribution results will be sorted in
          some way.
        type: boolean
      categories:
        description: >-
          List of categories that had been used to select specific values
          for this aggregation of the matched data.
        type: array
        minItems: 1
        items:
          $ref: ../../requests/filteringTerms.yaml#$defs/FilteringTermInRequest   
        examples:
          - - id: NCIT:C9384
              name: Kidney Carcinoma
            - id: NCIT:C3513
              name: Esophageal Carcinoma
            - id: NCIT:C35850
              name: Head and Neck Carcinoma
          - - id: EFO:0030075
              name: cDNA microarray
            - id: EFO:0010938
              name: large-insert clone DNA microarray
      splits:
        description: >-
          Optional list of **sorted** splits to group values for ranges or bins
          when performing the aggregation. This is for information only and the values
          should be reflected in the distribution itself.
        type: array
        minItems: 1
        items:
          $ref: "../beaconAggregationTermsResults#/$defs/SplitItem"
    required:
      - id

  AggregationCategoriesResult:
    description: >-
      Aggregation object describing the count of one (or more, intersected)
      values for the concept(s) aggregated on.
    type: object
    properties:
      ids:
        description: >-
          Ordered list of ids of categories (one per concept in `concepts`).
          These can represent values from the respected property or interpolations (
          e.g. bins from splits).
        type: array
        items:
          type: string
      names:
        description: >-
          Ordered list of names for the categories (see `ids`).
        type: array
        items:
          type: string
      count:
        description: >-
          Count of occurrences for this categorie of the in the matched data.
        type: integer
        minimum: 0
    required:
      - ids
      - count
    additionalItems: True

  DistinctValuesCount:
    description: >-
      The number of distinct values for the aggregated concept(s) in the
      matched data. This can e.g. be used to represent the number of all
      distinct `biosample.id` values to report the number of distinct biosamples
      in the matched data.
    type: integer
    minimum: 0

  AnyValueCount:
    description: >-
      The number of any value for the the aggregated concept(s) in the
      matched data (excluding such with missing values for _any_ of the
      properties). 
      This can be used to report the data content for a given property (e.g.
      individuals with a reported `followupTime` value, regardless of the
      value), or of samples which have values for combined properties (e.g.
      all individuals with `followupTime`and reported `sex`).
    type: integer
    minimum: 0

