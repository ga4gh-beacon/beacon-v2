$schema: https://json-schema.org/draft/2020-12/schema
name: Beacon Aggregation Results
description: Beacon aggregate results section.
type: array
minItems: 0
items:
  $ref: "#/$defs/AggregationResultsInstance"
examples:
  $ref: ../examples-sections/beaconAggregationResults-examples.yaml#/examples
$defs:
  AggregationResultsInstance:
    description: >-
      Summary data from results, with distributions of values (or value combinations)
      for one or more concepts.

      Each summary is identified by an `id`, `label`, `description`, and a list
      of one or more `concepts`. An an optional `sorted` property can indicate
      to the client that the returned `distribution` of the aggregation objects
      response has some pre-defined order.

      Each of the `concepts` describes the scope (entity; `individual`, `biosample`
      ...), the property aggregated on, and optional `terms` or `splits` for
      selection or binning of the property values.

      TODO: Remove `id`, `label`, `description` for only selecting on concepts
      and just keeping those & the result properties?!
    type: object
    properties:
      id:
        type: string
        description: >-
          The id of the aggregation which can be used e.g. as a selector.
          TODO: Remove in favour of only selecting and reporting concepts?!
        examples:
          - DiseaseBySexAtBirth
          - FollowupTime
          - HistologicalDiagnoses
      label:
        description: >-
          The label for the aggregation concept(s) being reported on.
          TODO: Remove in favour of only selecting and reporting concepts?!
        type: string
        examples:
          - Genders
          - Diseases by Sex at Birth
          - Follow-up Time After Diagnosis
      description:
        description: >-
          Description of the aggregation performed for this term.
          TODO: Remove in favour of only selecting and reporting concepts?!
        type: string
      scope:
        description: >-
          The scope (entity type) for which the results are reported.
          TODO: Remove in favour of only selecting and reporting concepts?!
        type: string
        examples:
          - individual
          - biosample
          - genomicVariation
      concepts:
        type: array
        items:
          $ref: "#/$defs/AggregationConcept"
      distribution:
        description: >-
          A distribution contains a list of aggregation objects, where each describes
          the count of one (or more, intersected) values for the concept(s)
          aggregated on.
        type: array
        items:
          $ref: "#/$defs/AggregationObject"
      distinctValuesCount:
          $ref: "#/$defs/DistinctValuesCount"
      anyValueCount:
          $ref: "#/$defs/AnyValueCount"

    required:
      - concepts
      - anyOf:
          - distribution
          - distinctValuesCount
          - anyValueCount

    additionalItems: True

  AggregationConcept:
    description: >-
      Concept on which the aggregation was performed, including the property
      in the data model and optional termIds or splits for selection
      or binning of the property values.
    type: object
    properties:
      id:
        description: >-
          The aggregation term id. It can be used to limit or combine the aggregations
          performed.
        type: string
        examples:
          - followupTime
          - sexAtBirth
      label:
        description: >-
          A short label which e.g. can be used by clients to label diagrams or
          data tables.
        type: string
        examples:
          - Follow-up Time After Diagnosis
      description:
        description: >-
          A description of the summary concept, e.g. with details about the
          included property and the operations performed during aggregation.
      property:
        description: >-
          The property, including the entity/scope, in the data model on which the
          aggregation was performed.
        type: string
        examples:
          - biosample.histologicalDiagnosis.id
          - individual.sex.id
          - biosample.collectionMoment
      sorted:
        description: >-
          Indicates whether the resulting distribution results will be sorted in
          some way.
        type: boolean
      terms:
        description: >-
          Optional list of terms to select specific values for aggregation.
          TODO: 
            * id/label object definition
        type: array
        items:
          type: object
        examples:
          - - id: NCIT:C9384
              label: Kidney Carcinoma
            - id: NCIT:C3513
              label: Esophageal Carcinoma
            - id: NCIT:C35850
              label: Head and Neck Carcinoma
            - id: NCIT:C4878
              label: Lung Carcinoma
            - id: NCIT:C207229
          - - id: EFO:0030075
              label: cDNA microarray
            - id: EFO:0010938
              label: large-insert clone DNA microarray
            - id: EFO:0010939
              label: oligonucleotide DNA microarray
            - id: EFO:0010937
              label: comparative genomic hybridization (CGH)
        splits:
          description: >-
            Optional list of **sorted** splits to group values for ranges or bins
            when performing the aggregation.
            TODO: 
              * Define types and/or couple them to property type
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/SplitItem"
          examples:
            - - value: P18M
                label: < 18 months
              - value: P18Y
                label: 1.5 to < 18 years
              - value: P65Y
                label: 18 to < 65 years
              - value: P150Y
                label: 65 years and older
            - - value: 0
                label: "0"
              - value: 1
                label: "1"
              - value: 2
                label: "2 or more"
    required:
      - id

  AggregationObject:
    description: >-
      Aggregation object describing the count of one (or more, intersected)
      values for the concept(s) aggregated on.
    type: object
    properties:
      conceptValues:
        description: >-
          List of ordered concept values (one per concept in `concepts`). These
          can represent values from the respected property or interpolations (
          e.g. bins from splits).
        type: array
        items:
          $ref: "#/$defs/ConceptValue"
      count:
        description: >-
          Count of occurrences for this aggregation object in the matched data.
        type: integer
        minimum: 0
    required:
      - conceptValues
      - count
    additionalItems: True

  ConceptValue:
    description: >-
      A value or bin ... for the concept property.
    type: object
    properties:
      id:
        description: >-
          Identifier for the concept value. This can be e.g. a term id, a bin
          (e.g. '[P0D, P18M)'), or `undefined` for missing values.
        type: string
        examples:
          - NCIT:C4017
          - '[P0D, P18M)'
          - undefined
      label:
        description: >-
          Human readable label for the concept value.
        type: string
        examples:
          - Breast Ductal Carcinoma
          - younger than 18 months
    required:
      - id
    additionalItems: True

  SplitItem:
    description: >-
      A split item for binning values during aggregation.
    type: object
    properties:
      value:
        description: >-
          The value for the split, representing the inclusive lower bounds.
          TODO: Other types than string? String can be a value/unit string...
          Overmodeling this might get too complex.
        type: string
        examples:
          - P18M
          - 0
      label:
        description: >-
          A human readable label for the bin resulting from the split.
        type: string
        examples:
          - < 18 months
          - 10kg to less than 25kg

  DistinctValuesCount:
    description: >-
      The number of distinct values for the aggregated concept(s) in the
      matched data. This can e.g. be used to represent the number of all
      distinct `biosample.id` values to report the number of distinct biosamples
      in the matched data.
    type: integer
    minimum: 0

  AnyValueCount:
    description: >-
      The number of any value for the the aggregated concept(s) in the
      matched data (excluding such with missing values for _any_ of the
      properties). 
      This can be used to report the data content for a given property (e.g.
      individuals with a reported `followupTime` value, regardless of the
      value), or of samples which have values for combined properties (e.g.
      all individuals with `followupTime`and reported `sex`).
    type: integer
    minimum: 0

