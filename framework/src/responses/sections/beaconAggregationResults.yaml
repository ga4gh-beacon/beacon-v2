$schema: https://json-schema.org/draft/2020-12/schema
name: Beacon Aggregation Results
description: Beacon aggregate results section.
type: array
minItems: 0
items:
  $ref: "#/$defs/AggregationResultsInstance"
examples:
  - 
    - id: NCIT:C3359
      label: Rhabdomyosarcoma
      entryTypeId: biosample
      count: 42
    - id: ageAtDiagnosis:<=P17Y
      label: age at diagnosis younger than 18 years
      entryTypeId: individual
      count: 44
    - id: sex:=female
      label: female sex at birth
      entryTypeId: individual
      count: 13
    - id: sexAtBirth
      label: sex at birth
      entryTypeId: individual
      distribution:
        male: 23
        female: 11
        unknown: 0
    - id: biosample.histological_diagnosis.id
      label: histological diagnosis
      entryTypeId: biosample
      distribution:
        NCIT:C4028: 9
        NCIT:C4520: 2
        NCIT:C48596: 23
    - id: sexPerDisease
      label: Sex distribution per cancer type
      description: sex per NCIT cancer code (custom format)
      entryTypeId: biosample
      report:
        - id: NCIT:C4872
          label: Breast Carcinoma
          counts:
            femaleAtBirth: 836
            maleAtBirth: 3
        - id: NCIT:C3513
          label: Esophageal Carcinoma
          counts:
            femaleAtBirth: 36
            maleAtBirth: 81
    - id: cnvstats
      label: CNV frequencies
      entryTypeId: analysis
      description: >-
        CNV frequencies per 1Mb genomic bin
      schema: https://www.example.org/cnvFrequenciesSchema
      report:
        intervalfrequencies:
          - id: 1p:000000000-000400000
            cytobands: 1p36.33
            no: 1
            referenceName: chr1
            start: 0
            end: 400000
            gainFrequency: 2.613
            lossFrequency: 6.188
          - id: 1p:000400000-001400000
            cytobands: 1p36.33
            no: 2
            referenceName: chr1
            start: 400000
            end: 1400000
            gainFrequency: 3.816
            lossFrequency: 9.694

$defs:
  AggregationResultsInstance:
    description: >-
      Summary data from results, with distributions for the aggregation terms
      given in the request.
      The model supports three alternative types of content for aggregation result
      instances:

      * a simple `count` result
      * a `distribution` for counts of multiple values
      * a `report` object for unspecified types of structured data, e.g. when there
        is a need to provide additional attributes
    type: object
    properties:
      id:
        $ref: ../../requests/summaryTerms.yaml#/$defs/AggregationTerm
        description: >-
          The id of the aggregation term being reported on.
      label:
        description: >-
          The label of the aggregation term being reported on.
        type: string
        examples:
          - Genders
      entryTypeId:
        description: >-
          Id of the entry type in the Beacon model for which the observations
          were reported.
          For the Beacon default model this is one of `individual`, `biosample`,
          `analysis`, `run`, or `genomicVariation`.
          The values here are not limited to the Beacon defaults to allow
          modified or alternative data models.
          This parameter would can be omitted, with the default being the id of
          the entryType for which the Beacon is providing the current results.
        type: string
      description:
        description: >-
          Description of the aggregation performed for thios term.
        type: string
      count:
        description: >-
          Number of observations for this aggregation term.
        type: integer
        minimum: 0
      distribution:
        $ref: "#/$defs/DistributionInstance"
      report:
        $ref: "#/$defs/Report"

    required:
      - id
    oneOf:
      - required:
        - count
      - required:
        - distribution
      - required:
        - report
    additionalItems: True

  DistributionInstance:
    description: >-
      A distribution contains one or more values and their observed counts, e.g.
      when using unvalued aggregation concepts such as e.g. aggregation on the
      disease types (instead of getting the count for a specific disease) or on
      sex (instead on separate counts for each option).  
    type: object
    additionalProperties:
      type: integer
      minProperties: 1
      minimum: 0
    examples:
      - male: 23
        female: 11
        unknown: 0
      - NCIT:C4028: 9
        NCIT:C4520: 2
        NCIT:C48596: 23

  Report:
    description: >-
      Report for this aggregation term representing a summary of results beyond
      a count of occurrences in the matched data. The format is left to the
      implementation but should not expose information about individual records.  
    type: object
    schema:
      description: >-
        Optional reference to a schema for this report.
      type: string
    additionalItems: True
