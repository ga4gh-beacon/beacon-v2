$schema: https://json-schema.org/draft/2020-12/schema
name: Beacon Aggregation Results
description: Beacon aggregate results section.
type: array
minItems: 0
items:
  $ref: "#/$defs/AggregationResultsInstance"
examples:
  - 
    - id: NCIT:C3359
      label: Rhabdomyosarcoma
      entity: biosample
      count: 42
    - id: ageAtDiagnosis:<=P17Y
      label: age at diagnosis younger than 18 years
      entity: individual
      count: 44
    - id: sex:=female
      label: female sex at birth
      entity: individual
      count: 13
    - id: cnvstats
      label: CNV frequencies
      entity: analysis
      description: >-
        CNV frequencies per 1Mb genomic bin
      schema: https://www.example.org/cnvFrequenciesSchema
      report:
        intervalfrequencies:
          - id: 1p:000000000-000400000
            cytobands: 1p36.33
            no: 1
            referenceName: chr1
            start: 0
            end: 400000
            gainFrequency: 2.613
            lossFrequency: 6.188
          - id: 1p:000400000-001400000
            cytobands: 1p36.33
            no: 2
            referenceName: chr1
            start: 400000
            end: 1400000
            gainFrequency: 3.816
            lossFrequency: 9.694

$defs:
  AggregationResultsInstance:
    description: >-
      Summary data from results, with distributions for the aggregation terms
      given in the request.
    type: object
    properties:
      id:
        $ref: ../../requests/summaryTerms.yaml#/$defs/AggregationTerm
        description: >-
          The id of this aggregation term
      label:
        description: >-
          Label for this aggregation term
        type: string
        example: Genders
      entity:
        description: >-
          Entity for which the observations were reported. For the Beacon default
          model this is one of `individual`, `biosample`, `analysis`, `run`, or
          `genomicVariation`. The values here are not limited to the Beacon
          defaults to allow modified or alternative data models.
          Usually this parameter would be omitted, with the default being the 
          entity for which the Beacon is providing the current results.
        type: string
      description:
        description: >-
          Description of this aggregation term
        type: string
      count:
        description: >-
          Number of observations for this aggregation term.
        type: integer
        minimum: 0
      report:
        $ref: "#/$defs/Report"

    required:
      - id
      - oneOf:
        - count
        - report
    additionalItems: True

  Report:
    description: >-
      Report for this aggregation term representing a summary of results beyond
      a count of occurrences in the matched data. The format is left to the
      implementation but should not expose information about individual records.  
    type: object
    schema:
      description: >-
        Optional reference to a schema for this report.
      type: string
    additionalItems: True
