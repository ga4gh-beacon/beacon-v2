$schema: https://json-schema.org/draft/2020-12/schema
aggregators:
  - requestId: aggr1
    aggregationTerms:
      - id: SexAtBirth

  - requestId: aggr2
    aggregationTerms:
      - id: SelectedCarcinomaDiagnoses
        label: Selected diagnoses (some carcinoma entities)
        categories:
          - value: NCIT:C2919
            name: Prostate Adenocarcinoma
          - value: NCIT:C4017
            name: Breast Ductal Carcinoma
          - value: NCIT:C3512
            name: Lung Adenocarcinoma

  - requestId: aggr3
    aggregationTerms:
      - id: SexAtBirth
        categories:
          - value: NCIT:C16576
          - value: NCIT:C20197
      - id: SelectedCarcinomaDiagnoses
        categories:
          - value: NCIT:C2919
            name: Prostate Adenocarcinoma
          - value: NCIT:C4017
            name: Breast Ductal Carcinoma
          - value: NCIT:C3512
            name: Lung Adenocarcinoma

  - requestId: aggr4
    aggregationTerms:
      - id: AgeOfOnset
        categories:
          - rangeBounds:
              - P0D
              - P18M
            name: birth to 18 months
            sortOrder: 1
          - rangeBounds:
              - P18M
              - P10Y
            name: 1.5 to 10 years
            sortOrder: 2
          - rangeBounds:
              - P10Y
              - P60Y
            name: 10 to 60 years
            sortOrder: 3
          - rangeBounds:
              - P60Y
            name: 60 years and older
            sortOrder: 4

  - requestId: aggr5
    aggregationTerms:
      - id: CancerPanelGeneIds
        label: Cancer Panel Genes
        categories:
          - value: CDKN2A
          - value: TP53
          - value: EGFR
          - value: MYCN
      - id: VariantVRSCNVtype
        categories:
          - value: EFO:0020073
            name: high-level loss
          - value: EFO:0030072
            name: high-level gain

