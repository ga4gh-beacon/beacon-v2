$schema: https://json-schema.org/draft/2020-12/schema
title: Aggregation Terms
description: |-
  Terms used to specify items to return in an aggregation data response. Terms
  are provided through the beacon's `/aggregation_terms` endpoint and the `id`
  values of those terms constitute the possible `id` values here. See also the
  documentation for `AggregationTermInResponse.id` in `beaconAggregationTermsResults`.

  * The `AggregationsInRequest` list is the list of all aggregations resulting
    in a distribution of one or more dimensional aggregation results.
  * The individual aggregations have lists of 1 or more (but mostly 1 or 2)
    **aggregation terms**, usually corresponding to individual properties.
  * If more than 1 aggregation term is provided it means that the corresponding
    properties should be evaluated together, e.g. all combinations of 
    "diagnoses (1) for sex at birth (2)".
  * The individual aggregation terms can have modifiers to specify individual
    values or value ranges to be aggregated, e.g. selected diagnoses or age
    groups.
type: array
items:
  $ref: '#/$defs/AggregationsInRequest'

$defs:
  AggregationsInRequest:
    description: >-
      An aggregation request object representing a single aggregation to be performed by
    type: object
    $comment: >-
          to review
    properties:
      requestId:
        description: >-
          An optional id for the aggregation request, which can be used for
          tracking and logging purposes. This is not used by the beacon for
          processing the request but can be included in the response metadata.
        type: string
      aggregationTerms:
        description: >-
          An array of `AggregationTermInRequest` objects representing the terms
          to be aggregated for a single aggregation, e.g. terms corresponding to
          `sexAtBirth` and `diagnosis`.
        type: array
        items:
          $ref: '#/$defs/AggregationTermInRequest'
    required:
      - requestId
      - aggregationTerms
    examples:
      - requestId: aggr1
        # Simple example of one aggregation term for "sex". All values in individual.sex will be returned as categories in the response distribution.
        aggregationTerms:
          - id: Sex
      - requestId: aggr2
        # Example of one aggregation for which just a subset of values are returned.
        aggregationTerms:
          - id: Sex
            categories:
              - - id: NCIT:C16576
                - id: NCIT:C20197
      - requestId: aggr3
        # Example of an aggregation that includes two dimensions, like a two
        # entry table. The example also selects some specific categories for the
        # second term. If the first term has 2 categories, and all possible
        # combinations exists in the data itself, the result would include 6 "cells"
        # with the corresponding count.
        aggregationTerms:
          - id: SexAtBirth
          - id: HistologicalDiagnoses
            categories:
              - id: NCIT:C2919
              - id: NCIT:C4017
              - id: NCIT:C3512
      - requestId: aggr4
        # Example of an aggregation with splits for the term "age of onset".
        aggregationTerms:
          - id: AgeOfOnset
  AggregationTermInRequest:
    type: object
    description: >-
      An object representing an individual term to be aggregated, e.g. a term
      corresponding to `sexAtBirth` or `diagnosis`. The `id` property is required
      and identifies the term to be aggregated, while the `filters` and `splits`
      properties are optional modifiers of the aggregation term.
      Note: The request object does not specifiy the property or scope of the
      aggregation.
    properties:
      id:
        type: string
        description: >-
          The `id` of the aggregation term as provided by the beacon. It is used
          to select the aggregation term, _i.e._ usually corresponding to a
          property in the data model. 
        examples:
          - id: selectedDiagnoses
          - id: biosample.histologicalDiagnosis.id
          - id: sexAtBirth
          - id: ageAtDiagnosis
      selectors:
        description: >-
          List of selectors to select specific values of the given property
          for aggregation, as a modifier of the aggregation term. For example,
          for an aggregation term of `diagnosis` selectors could be used to specify
          a subset of diagnoses to be aggregated.
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/ValueForAggregation"
            - $ref: "#/$defs/RangeForAggregation"
            - $ref: "#/$defs/SplitForAggregation"
    required:
      - id

  ValueForAggregation:
    description: >-
      An object representing a specific value of the property on which the aggregation is performed, used as a modifier of the aggregation term to select specific values for aggregation. For example, for an aggregation term of `diagnosis` this could be used to specify a specific diagnosis to be aggregated.
    type: object
    properties:
      value:
        type: string
        description: >-
          The specific value of the category or value to be aggregated, e.g. an
          ontology term CURIE an alphanumeric value.
      label:
        type: string
        description: >-
          An optional label for the value, e.g. to allow the service to return
          in an informative response.
      examples:
        - value: NCIT:C9384
          label: Kidney Carcinoma
        - value: female
      required:
        - value

  RangeForAggregation:
    type: object
    properties:
      rangeBounds:
        description: >-
          The limits of the range, representing inclusive lower bounds to exclusive
          upper bounds. When only one value is given, it represents the lower
          bound and the upper bound is considered unbounded. The format of the
          values should be consistent with the type of the property being split,
          e.g. ISO8601 durations for time intervals or numeric values for continuous
          numeric variables. 
        type: array
        items:
          type:
            - string
            - number
        minItems: 1
      label:
        type: string
      sortOrder:
        description: >-
          Integer to specify the intended order of splits. This is required to
          ensure the correct order of bins in the results, or for the client to
          be able to reconstruct the expected order in case any of the intermediate
          steps reorders them.
        type: integer
    examples:
      - rangeBounds: [P0M,P18M]
        label: birth to 18 months
        sortOrder: 1
    required:
      - rangeBounds
      - sortOrder 

  SplitForAggregation:
    description: >-
      A split item for partitioning the values during aggregation.
    type: object
    properties:
      splitValue:
        description: >-
          A value at which the split should occur in the properties value space.
          The format of the value should be consistent with the type of the property
          being split, e.g. ISO8601 durations for time intervals or numeric values
          for continuous numeric variables.
          Split values are exclusive upper bounds for the resulting bins, meaning
          that values equal to the split value will be included in the next bin.
          Note: To cover the complete value space one might use a (last) split
          value that extends beyond the maximum value in the data, e.g. `P150Y` for
          age at diagnosis.
        type:
          - string
          - number
      label:
        description: >-
          A human readable label for the bin resulting from the split.
        type: string
      sortOrder:
        description: >-
          Integer to specify the intended order of splits. This is required to
          ensure the correct order of bins in the results, or for the client to
          be able to reconstruct the expected order in case any of the intermediate
          steps reorders them.
        type: integer
    required:
      - splitValue
      - sortOrder 
    examples:
      - splitValue: P65Y
        label: younger than 65 years
        sortOrder: 1
      - splitValue: P150Y
        label: 65 years and older   # Note: This label depends on a preceding
        sortOrder: 2
      - splitValue: 25
        label: 25kg or higher
        sortOrder: 3
