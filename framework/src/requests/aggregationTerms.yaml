$schema: https://json-schema.org/draft/2020-12/schema
title: Aggregation Terms
description: |-
  Terms used to specify items to return in an aggregation data response. Terms
  are provided through the beacon's `/aggregation_terms` endpoint and the `id`
  values of those terms constitute the possible `id` values here. See also the
  documentation for `AggregationTermInResponse.id` in `beaconAggregationTermsResults`.

  Note: The request for aggregations is a list of lists of objects:
  * The outer list level is the list of all aggregations ("concepts") resulting
    in a distribution of one or more dimensional aggregation results.
  * The individual concepts have lists of 1 or more (but mostly 1 or 2)
    aggregation terms - corresponding to individual properties - which are
    evaluated together, e.g. "diagnoses (1) for sex at birth (2)".
type: array
items:
  $ref: '#/$defs/AggregationsInRequest'

$defs:
  AggregationsInRequest:
    type: object
    $comment: >-
          to review
    properties:
      requestId:
        description: >-
          An optional id for the aggregation request, which can be used for
          tracking and logging purposes. This is not used by the beacon for
          processing the request but can be included in the response metadata.
        type: string
      aggregationTerms:
        description: >-
          An array of `AggregationTermInRequest` objects representing the terms
          to be aggregated for a single aggregation, e.g. terms corresponding to
          `sexAtBirth` and `diagnosis`.
        type: array
        items:
          $ref: '#/$defs/AggregationTermInRequest'
    description: >-
      An array of `AggregationTermInRequest` objects representing the terms
      to be aggregated for a single aggregation, e.g. terms corresponding to
      `sexAtBirth` and `diagnosis`.
    required:
      - requestId
      - aggregationTerms
    examples:
      - requestId: aggr1
        # Simple example of one aggregation term for "sex". All values in individual.sex will be returned as categories in the response distribution.
        aggregationTerms:
          - id: Sex
      - requestId: aggr2
        # Example of one aggregation for which just a subset of values are returned.
        aggregationTerms:
          - id: Sex
            categories:
              - - id: NCIT:C16576
                - id: NCIT:C20197
      - requestId: aggr3
        # Example of an aggregation that includes two dimensions, like a two
        # entry table. The example also selects some specific categories for the
        # second term. If the first term has 2 categories, and all possible
        # combinations exists in the data itself, the result would include 6 "cells" with the corresponding count.
        aggregationTerms:
          - id: SexAtBirth
          - id: HistologicalDiagnoses
            categories:
              - id: NCIT:C2919
              - id: NCIT:C4017
              - id: NCIT:C3512
      - requestId: aggr4
        # Example of an aggregation with splits for the term "age of onset".
        aggregationTerms:
          - id: AgeOfOnset
  AggregationTermInRequest:
    type: object
    description: >-
      An object representing an individual term to be aggregated, e.g. a term
      corresponding to `sexAtBirth` or `diagnosis`. The `id` property is required
      and identifies the term to be aggregated, while the `filters` and `splits`
      properties are optional modifiers of the aggregation term.
      Note: The request object does not specifiy the property or scope of the
      aggregation.
    properties:
      id:
        type: string
        description: >-
          The `id` of the aggregation term as provided by the beacon. It is used
          to select the aggregation term, _i.e._ usually corresponding to a
          property in the data model. 
        examples:
          - id: selectedDiagnoses
          - id: biosample.histologicalDiagnosis.id
          - id: sexAtBirth
          - id: ageAtDiagnosis
      categories:
        description: >-
          List of categories to select specific values of the given property
          for aggregation, as a modifier of the aggregation term. For example,
          for an aggregation term of `diagnosis` categories could be used to specify
          a subset of diagnoses to be aggregated.
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/ValuesForAggregation"
            - $ref: "#/$defs/SplitItem"
    required:
      - id

  ValuesForAggregation:
    description: >-
      An object representing a specific value of the property on which the aggregation is performed, used as a modifier of the aggregation term to select specific values for aggregation. For example, for an aggregation term of `diagnosis` this could be used to specify a specific diagnosis to be aggregated.
    type: object
    properties:
      id:
        type: string
        description: >-
          The `id` of the category or value to be aggregated, e.g. an ontology term CURIE or a value from a controlled list.
        examples:
          - NCIT:C9384
  SplitItem:
    # TO DO: Provide an example that is not the same than in beaconAggregationTermsResults, to avoid confusion between request and response examples.
    description: >-
      A split item for binning values during aggregation.
    type: object
    properties:
      splitBounds:
        description: >-
          The values for the split, representing inclusive lower bounds to exclusive upper bounds. When only one value is given, it represents the lower bound and the upper bound is considered unbounded. The format of the values should be consistent with the type of the property being split, e.g. ISO8601 durations for time intervals or numeric values for continuous numeric variables. 
        type: array
        minItems: 1
      label:
        description: >-
          A human readable label for the bin resulting from the split.
        type: string
      sortOrder:
        description: >-
          Integer to specify the intended order of splits. This is required to ensure the correct order of bins in the results, or for the client to be able to reconstruct the expected order in case any of the intermediate steps reorders them.
        type: integer
    required:
      - splitBounds
      - sortOrder 
    examples:
      - - splitBounds: [P0M,P18M]
          label: birth to 18 months
          sortOrder: 1
        - splitBounds: [P18M,P18Y]
          label: 18 months to less than 18 years
          sortOrder: 2
        - splitBounds: [P18Y,P65Y]
          label: 18 years to less than 65 years
          sortOrder: 3
        - splitBounds: [P65Y]
          label: 65 years and older
          sortOrder: 4
      - - splitBounds: [0,10]
          label: 0kg to less than 10kg
          sortOrder: 1
        - splitBounds: [10,25]
          label: 10kg to less than 25kg
          sortOrder: 2
        - splitBounds: [25]
          label: 25kg or higher
          sortOrder: 3
