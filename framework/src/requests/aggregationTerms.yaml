$schema: https://json-schema.org/draft/2020-12/schema
title: Aggregation Terms
description: |-
  Terms used to specify items to return in an aggregation data response. Terms
  are provided through the beacon's `/aggregation_terms` endpoint and the `id`
  values of those terms constitute the possible `id` values here. See also the
  documentation for `AggregationTermInResponse.id` in `beaconAggregationTermsResults`.

  Note: The request for aggregations is a list of lists of objects:
  * The outer list level is the list of all aggregations ("concepts") resulting
    in a distribution of one or more dimensional aggregation results.
  * The individual concepts have lists of 1 or more (but mostly 1 or 2)
    aggregation terms - corresponding to individual properties - which are
    evaluated together, e.g. "diagnoses (1) for sex at birth (2)".
type: array
items:
  $ref: '#/$defs/AggregationsInRequest'

$defs:
  AggregationsInRequest:
    type: object
    $comment: >-
          to review
    properties:
      requestId:
        description: >-
          An optional id for the aggregation request, which can be used for
          tracking and logging purposes. This is not used by the beacon for
          processing the request but can be included in the response metadata.
        type: string
      aggregationTerms:
        description: >-
          An array of `AggregationTermInRequest` objects representing the terms
          to be aggregated for a single aggregation, e.g. terms corresponding to
          `sexAtBirth` and `diagnosis`.
        type: array
        items:
          $ref: '#/$defs/AggregationTermInRequest'
        examples:
          - - id: SexAtBirth
    description: >-
      An array of `AggregationTermInRequest` objects representing the terms
      to be aggregated for a single aggregation, e.g. terms corresponding to
      `sexAtBirth` and `diagnosis`.
    required:
      - requestId
      - aggregationTerms
    examples:
      - requestId: agg1
        aggregationTerms:
          - id: SexAtBirth
      - requestId: agg2
        aggregationTerms:
          - id: SexAtBirth
          - id: HistologicalDiagnoses
            aggregationFilters:
              - id: NCIT:C9384
              - id: NCIT:C3513
              - id: NCIT:C35850
  AggregationTermInRequest:
    type: object
    description: >-
      An object representing an individual term to be aggregated, e.g. a term
      corresponding to `sexAtBirth` or `diagnosis`. The `id` property is required
      and identifies the term to be aggregated, while the `filters` and `splits`
      properties are optional modifiers of the aggregation term.
      Note: The request object does not specifiy the property or scope of the
      aggregation.
    properties:
      id:
        type: string
        description: >-
          The `id` of the aggregation term as provided by the beacon. It is used
          to select the aggregation term, _i.e._ usually corresponding to a
          property in the data model. 
        examples:
          - id: selectedDiagnoses
          - id: biosample.histologicalDiagnosis.id
          - id: sexAtBirth
          - id: ageAtDiagnosis
      filtersForAggregation:
        description: >-
          List of filters to select specific values of the given property
          for aggregation, as a modifier of the aggregation term. For example,
          for an aggregation term of `diagnosis` filters could be used to specify
          a subset of diagnoses to be aggregated.

          Notes:

          * While using the prototype of filters in the filtering section, these
            filters are not chained by the logical AND operator but are applied as
            a set of values to be used for the aggregation (i.e. evaluated separately)
          * The `scope` property from `filteringTerms` does not apply since the scope
            is defined through the aggregation term itself.
          * For value binning use the `splits` property instead of filters.
        type: array
        items:
          $ref: './filteringTerms.yaml#/$defs/FilteringTermInRequest'
        examples:
          - - id: NCIT:C9384
            - id: NCIT:C3513
            - id: NCIT:C35850
          - - id: sex:male
            - id: sex:female
            - id: sex:other
          - - id: BMI
              operator: <
              value: 17
          - - id: NCIT:C11112
              includesDescendants: true
      customSplits:
        $ref: '../responses/sections/beaconAggregationTermsResults.yaml#/$defs/SplitItem'
    required:
      - id

