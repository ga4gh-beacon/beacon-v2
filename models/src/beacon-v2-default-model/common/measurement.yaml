$schema: https://json-schema.org/draft/2020-12/schema
title: Measurement
description: >-
  Definition of a measurement class.
  Provenance: GA4GH Phenopackets v2 `Measurement`
type: object
properties:
  assay:
    description: >-
      Class that describes the assay used to produce the measurement.
    $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
    examples:
      - id: LOINC:26515-7
        label: "Platelets [#/volume] in Blood"
  measurementValue:
    description: The result of the measurement
    oneOf:
      - $ref: ./value.yaml
      - $ref: ./complexValue.yaml
  description:
    description: >-
      Unstructured text to describe this measurement.
    type: string
    examples:
      - Some free text
  timeObserved:
    description: >-
      Moment in time at which measurement was performed. RECOMMENDED.
    $ref: ./timeElement.yaml
    examples:
      - age:
          iso8601duration: P53Y8M
      - timestamp: 2026-10-15T09:10:41Z
  procedure:
    description: >-
      Clinical procedure performed to acquire the sample used for the measurement
    $ref: ./procedure.yaml
    examples:
      - code:
          id: NCIT:C5189
          label: Radical Cystoprostatectomy
  date:
    description: >-
      Date of measurement.
      Addition compared to Phenopackets model.
      TODO: Keep?
    type: string
    format: date
required:
  - assay
  - measurementValue
additionalProperties: true
