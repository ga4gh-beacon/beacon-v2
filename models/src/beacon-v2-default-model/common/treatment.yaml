$schema: https://json-schema.org/draft/2020-12/schema
title: Treatment
description: >-
  Treatment(s) prescribed/administered, defined by treatment ID, date and
  age of onset, dose, schedule and duration.
  Provenance: Phenopackets v2 `Treatment`
type: object
properties:
  agent:
    description: >-
      Code of treatment. Value from NCIT or any relevant ontology.
    $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
    examples:
      - id: NCIT:C287
        label: Aspirin
      - id: NCIT:C62078
        label: Tamoxifen
  routeOfAdministration:
    description: >-
      Route of treatment. Value from NCIT Route of Administration tree (NCIT:C38114).
    $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
    examples:
      - id: NCIT:C38304
        label: Topical
      - id: NCIT:C78373
        label: Dietary
  doseIntervals:
    type: array
    items:
      $ref: ./doseInterval.yaml
  drugType:
    $ref: ./drugType.yaml
  cumulativeDose:
    $ref: ./quantity.yaml
  ageAtOnset:
    description: >-
      Age at treatment. Addition compared to Phenopackets model.
      TODO: Keep? Needs a general solution for chaining treatments w/ time points,
      diseases.
    $ref: ./age.yaml
required:
  - agent
additionalProperties: true
