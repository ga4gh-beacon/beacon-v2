components:
  parameters:
    biosampleIDList:
      description: Comma-separated list of biosample IDs to filter expression values.
      in: query
      name: biosampleIDList
      schema:
        type: string
    entryId:
      in: path
      name: id
      required: true
      schema:
        type: string
    featureIDList:
      description: Comma-separated list of feature IDs to filter expression values.
      in: query
      name: featureIDList
      schema:
        type: string
    filters:
      examples:
        example1:
          value:
          - NCIT:C20197
      in: query
      name: filters
      schema:
        items:
          type: string
        type: array
    includeResultsetResponses:
      in: query
      name: includeResultsetResponses
      schema:
        $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/beaconCommonComponents.json#/definitions/IncludeResultsetResponses
    limit:
      in: query
      name: limit
      schema:
        $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/beaconCommonComponents.json#/$defs/Limit
    maxValue:
      description: Maximum expression count value to filter results.
      in: query
      name: maxValue
      schema:
        type: number
    minValue:
      description: Minimum expression count value to filter results.
      in: query
      name: minValue
      schema:
        type: number
    requestedSchema:
      description: Schema to be used to format the `result` field in the response. The response will use
        Beacon format.
      example: ga4gh-service-info-v1.0
      in: query
      name: requestedSchema
      required: false
      schema:
        type: string
    skip:
      in: query
      name: skip
      schema:
        $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/beaconCommonComponents.json#/$defs/Skip
  responses:
    ResultsOKResponse:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconBooleanResponse.json
            - $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconCountResponse.json
            - $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconResultsetsResponse.json
      description: Successful operation.
  schemas:
    ExpressionValuesRequestBody:
      allOf:
      - $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/requests/beaconRequestBody.json
      - properties:
          biosampleIDList:
            description: Comma-separated list of biosample IDs to filter expression values.
            type: string
          featureIDList:
            description: Comma-separated list of feature IDs to filter expression values.
            type: string
          maxValue:
            description: Maximum expression count value to filter results.
            type: number
          minValue:
            description: Minimum expression count value to filter results.
            type: number
        type: object
