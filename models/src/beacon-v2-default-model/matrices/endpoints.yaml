paths:
  /matrices:
    get:
      description: Get a list of matrices
      operationId: getMatrices
      parameters:
      - $ref: '#/components/parameters/requestedSchema'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/includeResultsetResponses'
      - $ref: '#/components/parameters/filters'
      responses:
        '200':
          $ref: '#/components/responses/ResultsOKResponse'
        default:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconErrorResponse.json
      tags:
      - GET Endpoints
    post:
      description: Get a Beacon response for matrices
      operationId: postMatricesRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/requests/beaconRequestBody.json
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ResultsOKResponse'
        default:
          content:
            application/json:
              schema:
                $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconErrorResponse.json
          description: An unsuccessful operation
      tags:
      - POST Endpoints
  /matrices/filtering_terms:
    get:
      description: Get the list of filtering terms that could be used with matrices.
      operationId: getMatricesFilteringTerms
      parameters:
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconFilteringTermsResponse.json
          description: Successful operation
        default:
          content:
            application/json:
              schema:
                $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/responses/beaconErrorResponse.json
          description: An unsuccessful operation
      tags:
      - GET Endpoints
    post:
      description: Get the list of filtering terms that could be used with matrices.
      operationId: postMatricesFilteringTerms
      requestBody:
        content:
          application/json:
            schema:
              $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/requests/beaconRequestBody.json
        required: true
